openapi: 3.0.3
info:
  title: Sharedpage Voting
  version: 1.0.0
x-mendr-service: sharedpage-voting
x-mendr-source: sharedpage-gateway
x-mendr-host: sharedpage-internal
x-mendr-enforce: observe
servers:
  - url: http://voting:8080
paths:
  /v1/rounds/{id}/vote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Cast or clear vote
      responses:
        "200":
          description: Vote ack
  /internal/v1/rounds/{id}/tally:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Orchestrator tally
      responses:
        "200":
          description: Winner or skip
